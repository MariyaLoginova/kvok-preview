<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#131211">
    <meta name="description" content="KVOK Production — избранные проекты.">
    <meta name="robots" content="noindex,nofollow">
    <script>if (location.hash === '#services') location.replace('./production/#services');</script>
    <title>KVOK — Избранные проекты</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./src/portfolio.css">
    <script type="importmap">{"imports":{"three":"./vendor/three.module.js","gsap/gsap-core.js":"./vendor/gsap-core.js"}}</script>
  </head>
  <body>
    <main class="portfolio" data-portfolio aria-label="Избранные проекты KVOK">
      <div class="scene" data-scene aria-hidden="true">
        <div class="fallback-wall" data-wall></div>
        <img class="fallback-feature" data-fallback src="./media/ozon-xr-cover.webp" alt="" fetchpriority="high">
        <canvas class="scene-canvas" data-canvas></canvas>
      </div>
      <div class="shade" aria-hidden="true"></div>
      <header class="top">
        <a class="wordmark" href="./" aria-label="KVOK — главная">KVOK<span>.</span></a>
        <nav class="links" aria-label="Основная навигация">
          <button type="button" data-index-toggle aria-controls="project-index" aria-expanded="false">Проекты</button>
          <button type="button" data-contact>Контакты</button>
        </nav>
      </header>
      <aside id="project-index" class="index" data-index aria-label="Индекс проектов">
        <p class="index-label">Избранные проекты</p>
        <ol data-project-list></ol>
      </aside>
      <section class="caption" aria-live="polite" aria-atomic="true">
        <p class="count"><span data-count>01 / 09</span></p>
        <h1 data-title>Фортуната</h1>
        <p class="category" data-category>XR-продакшен</p>
        <button class="case-link" type="button" data-case>Смотреть проект <span aria-hidden="true">↗</span></button>
      </section>
      <footer class="bottom">
        <p class="gesture"><span aria-hidden="true">↕</span> <span data-gesture>Листайте или перетаскивайте</span></p>
        <div class="arrows" aria-label="Навигация по проектам">
          <button type="button" data-prev aria-label="Предыдущий проект">←</button>
          <button type="button" data-next aria-label="Следующий проект">→</button>
        </div>
      </footer>
      <noscript><p class="no-script">Для просмотра остальных проектов включите JavaScript.</p></noscript>
    </main>
    <dialog class="detail" data-detail aria-labelledby="detail-title">
      <div class="detail-inner">
        <form method="dialog"><button class="close" aria-label="Закрыть">×</button></form>
        <p class="detail-kicker" data-detail-kicker></p>
        <h2 id="detail-title" data-detail-title></h2>
        <div data-detail-body></div>
      </div>
    </dialog>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
